services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--features=resource-indicators", "--hostname=http://127.0.0.1:8080"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./auth/realm.json:/opt/keycloak/data/import/lumen.json:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
    mem_limit: 1g
  issues:
    build:
      context: ..
      dockerfile: deployment/issues.Dockerfile
    environment:
      LUMEN_ISSUER: http://127.0.0.1:8080/realms/lumen
      LUMEN_RESOURCE: http://127.0.0.1:8001/mcp
      LUMEN_JWKS_URL: http://keycloak:8080/realms/lumen/protocol/openid-connect/certs
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "/course/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  proxy:
    image: nginx:1.30.6-alpine3.24
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:8001:8081"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      issues:
        condition: service_healthy
    mem_limit: 64m
    pids_limit: 50
