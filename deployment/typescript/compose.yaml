services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--features=resource-indicators", "--hostname=http://127.0.0.1:8080"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./realm.json:/opt/keycloak/data/import/lumen.json:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
    mem_limit: 1g
  gateway:
    build:
      context: ../..
      dockerfile: deployment/typescript/gateway.Dockerfile
    environment:
      LUMEN_ISSUER: http://127.0.0.1:8080/realms/lumen
      LUMEN_RESOURCE: http://127.0.0.1:8001/mcp
      LUMEN_JWKS_URL: http://keycloak:8080/realms/lumen/protocol/openid-connect/certs
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/readyz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 12
  proxy:
    image: nginx:1.30.6-alpine3.24
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:8001:8081"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 64m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
