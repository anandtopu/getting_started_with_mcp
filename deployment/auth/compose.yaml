services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--features=resource-indicators", "--hostname=http://127.0.0.1:8080"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./realm.json:/opt/keycloak/data/import/lumen.json:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
