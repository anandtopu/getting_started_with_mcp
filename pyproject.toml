[build-system]
requires = ["hatchling>=1.33,<1.34"]
build-backend = "hatchling.build"

[project]
name = "getting-started-with-mcp"
version = "0.6.0"
description = "A practical MCP course built around synthetic Lumen Labs data"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp[cli]>=2.3.0,<2.4", "mcp-types==2.3.0", "pydantic>=2.14.2,<2.15",
  "httpx2>=2.16.0,<2.17", "python-dotenv>=1.2.4,<1.3", "rich>=15.0,<15.1",
  "anyio>=4.15.1,<4.16", "aiosqlite>=0.22.1,<0.23", "pypdf>=6.21.4,<6.22",
  "jsonschema>=4.26,<4.27",
]

[project.optional-dependencies]
host = ["anthropic>=2.3,<2.4", "openai>=3.41,<3.42", "google-genai>=2.34,<2.35", "ollama>=0.6.3,<0.7"]
http = ["fastapi>=0.162,<0.163", "starlette>=1.10,<1.11", "uvicorn>=0.54,<0.55"]
auth = ["pyjwt[crypto]>=2.15.1,<2.16"]
observability = ["opentelemetry-sdk>=1.45.2,<1.46", "opentelemetry-exporter-otlp>=1.45.2,<1.46"]
frameworks = [
  "openai-agents>=0.24.0,<0.25", "langgraph>=1.2.18,<1.3",
  "langchain[mcp]>=1.4.7,<1.5", "fastmcp>=4.1.4,<4.2",
  "pydantic-ai-slim[mcp]>=2.63.0,<2.64",
  "claude-agent-sdk>=0.2.175,<0.3",
]

[dependency-groups]
dev = ["pytest>=9.2,<9.3", "ruff>=0.17.3,<0.18", "pre-commit>=4.7,<4.8"]

[tool.hatch.build.targets.wheel]
packages = ["common", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
addopts = "-ra -m 'not live' --import-mode=importlib"
markers = ["live: requires an external service or model (opt in explicitly)"]
filterwarnings = ["error::DeprecationWarning:mcp.*", "error::DeprecationWarning:mcp_types.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
