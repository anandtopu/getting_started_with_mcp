[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"
[project]
name = "lumen-knowledge-course-anandtopu"
version = "1.0.0"
description = "Bounded personal Markdown retrieval over MCP"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["mcp==2.3.0", "mcp-types==2.3.0", "pydantic>=2.14.2,<2.15"]
[project.scripts]
lumen-knowledge = "lumen_knowledge.__main__:main"
[tool.hatch.build.targets.wheel]
packages = ["src/lumen_knowledge"]
