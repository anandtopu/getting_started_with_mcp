name: Course checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: npm ci
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_course.py --release
      - run: uv run --frozen python scripts/run_all_examples.py
      - run: uv run --frozen python scripts/tier1.py
      - run: uv run --frozen python scripts/tier2.py
      - run: uv run --frozen python scripts/tier3.py
      - run: uv run --frozen python checkpoints/03_security/acceptance.py
      - run: uv run --frozen python scripts/tier4.py
      - run: uv run --frozen python checkpoints/04_ecosystem/acceptance.py
  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
  inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: uv sync --frozen --extra http --extra auth --extra observability
      - run: npm ci
      - run: uv run --frozen python scripts/inspector_smoke.py
      - run: npm run inspector -- --cli uv run python data/security/vulnerable_server.py --lab --method tools/list
      - run: npm run inspector -- --cli node node_modules/@modelcontextprotocol/server-filesystem/dist/index.js data/files --method tools/list
  typescript-applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:typescript
      - run: docker compose -f deployment/typescript/compose.yaml up --build -d --wait --wait-timeout 180
      - run: npm run test:deployment:typescript
      - if: failure()
        run: docker compose -f deployment/typescript/compose.yaml logs --no-color --tail 80
      - if: always()
        run: docker compose -f deployment/typescript/compose.yaml down --volumes --remove-orphans
  keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --extra http --extra auth
      - run: docker compose -f deployment/auth/compose.yaml up -d
      - run: uv run --frozen python scripts/keycloak_check.py
      - if: failure()
        run: docker compose -f deployment/auth/compose.yaml logs --no-color --tail 60
      - if: always()
        run: docker compose -f deployment/auth/compose.yaml down
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --extra http --extra auth
      - run: docker compose -f deployment/security/compose.yaml build
      - run: uv run --frozen python scripts/container_check.py
  frameworks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [strands, adk]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv sync --frozen --project frameworks/${{ matrix.framework }} --python 3.12
      - run: uv run --frozen python scripts/framework_extras.py ${{ matrix.framework }}
  shipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: uv sync --frozen --all-extras --python 3.12
      - run: npm ci
      - run: uv run --frozen python scripts/package_lab.py --prepare
      - run: uv run --frozen python scripts/package_lab.py
      - run: uv run --frozen python scripts/knowledge_package.py --prepare
      - run: uv run --frozen python scripts/knowledge_package.py
      - run: npm run build:chat
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -f distribution/notes.Dockerfile -t lumen-notes-course:1.0.0 .
      - run: uv run --frozen python checkpoints/05_shipping/acceptance.py --container --docker-context default
      - run: docker compose -f deployment/compose.yaml up --build -d --wait --wait-timeout 120
      - run: uv run --frozen python scripts/keycloak_check.py --deployed
      - if: failure()
        run: docker compose -f deployment/compose.yaml logs --no-color --tail 60
      - if: always()
        run: docker compose -f deployment/compose.yaml down --remove-orphans
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: .runtime/phase7/chat-*.png
  external-links:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen
      - run: uv run python scripts/check_links.py --external

  native-sdks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        language: [go, csharp, rust, java]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --python 3.12
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: modules/bonus/B2_other_sdks/go/go.sum
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: uv run --frozen python scripts/native_sdks.py --language ${{ matrix.language }} --build
  ops-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --python 3.12
      - run: docker compose -f deployment/compose.yaml -f capstones/04_lumen_ops/deployment/compose.yaml up --build -d --wait --wait-timeout 180
      - run: uv run --frozen python scripts/keycloak_check.py --deployed
      - if: failure()
        run: docker compose -f deployment/compose.yaml -f capstones/04_lumen_ops/deployment/compose.yaml logs --no-color --tail 80
      - if: always()
        run: docker compose -f deployment/compose.yaml -f capstones/04_lumen_ops/deployment/compose.yaml down --volumes --remove-orphans
