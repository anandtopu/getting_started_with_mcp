[package]
name = "lumen-notes-course"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.8.0", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
